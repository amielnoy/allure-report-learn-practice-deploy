name: Deploy the report to Pages

# The report itself lives on `gh-pages`, which the publishing job in
# LearnPracticeWork force-pushes with `keep_files: false`. This workflow lives
# on `main` precisely so that force-push cannot delete it, and is started by a
# repository_dispatch from that same job — `repository_dispatch` always runs the
# workflow from the default branch, which a `push` trigger on `gh-pages` would
# not.
#
# Why this exists at all: this repo was served by the legacy "deploy from a
# branch" builder, which took about ten minutes per deployment and then began
# failing outright against its own timeout. The Actions path deploys the same
# content in seconds.
on:
  repository_dispatch:
    types: [report-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer report supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the Allure report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published report
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
